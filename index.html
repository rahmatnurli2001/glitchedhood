<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLITCHED HOOD — Waitlist</title>
<meta name="description" content="3333 unique glitched digital identities. Join the Glitched Hood waitlist.">
<style>
:root{--bg:#050505;--fg:#f7f7f7;--muted:#9a9a9a;--line:#e8e8e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:8px 8px}
main{max-width:720px;margin:auto;padding:34px 22px 70px}
h1{font-size:clamp(42px,11vw,82px);line-height:.85;margin:0 0 28px;text-align:center;letter-spacing:-4px;text-shadow:0 0 18px #fff}
.strike{height:2px;background:#fff;margin:-45px 12px 38px}
.tag{text-align:center;font-size:15px;letter-spacing:5px;font-weight:700;line-height:1.4;margin-bottom:34px}
.card{border:2px solid var(--line);border-radius:28px;padding:12px;box-shadow:0 0 20px rgba(255,255,255,.1)}
.art{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;background:radial-gradient(circle at 50% 40%,#666,#111 55%,#000);display:grid;place-items:center;overflow:hidden}
.art span{font-size:clamp(70px,20vw,160px);font-weight:900;filter:grayscale(1);transform:rotate(-8deg);opacity:.85}
.buttons{display:grid;gap:14px;margin-top:20px}
a,button{display:block;width:100%;padding:20px 18px;border:2px solid #fff;border-radius:16px;background:#080808;color:#fff;text-decoration:none;text-align:center;font-weight:900;letter-spacing:2px;font-size:16px}
a:hover,button:hover{background:#fff;color:#000}
.section{border:2px solid #ddd;border-radius:24px;padding:22px;margin-top:20px}
.section h2{margin:0 0 16px;font-size:28px}
label{display:block;color:#bbb;font-size:13px;letter-spacing:1px;margin:12px 0 7px}
input{width:100%;padding:18px;border-radius:12px;border:1px solid #777;background:#111;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#fff}
.small{color:#999;font-size:12px;line-height:1.5;margin-top:10px}
#status{text-align:center;min-height:24px;margin-top:14px;font-weight:700}
.ok{color:#fff}.err{color:#ff7070}
.footer{text-align:center;color:#777;margin-top:35px;font-size:12px;letter-spacing:2px}
.art img {
  width: calc(100% - 24px);
  height: calc(100% - 24px);
  object-fit: cover;
  display: block;
  margin: 12px;
  border-radius: 18px;
}
</style>
</head>
<body>
<main>
  <h1>GLITCHED HOOD</h1>
  <div class="strike"></div>
  <div class="tag">3333 UNIQUE GLITCHED DIGITAL<br>IDENTITIES</div>

  <div class="card">
  <div class="art" aria-label="Glitched Hood artwork">
    <img
      src="https://cdn.phototourl.com/free/2026-08-19-7e06863c-3625-4c2c-912f-008e0c7bf6e3.jpg"
      alt="Glitched Hood artwork"
    >
  </div>
</div>

  <div class="buttons">
    <a href="https://x.com/glitched_hood" target="_blank" rel="noopener">FOLLOW @GLITCHED_HOOD</a>
    <a href="https://x.com/glitched_hood/status/2089545273299370321" target="_blank" rel="noopener">LIKE / REPOST THE POST</a>
  </div>

  <section class="section">
    <h2>JOIN THE WAITLIST</h2>
    <form id="waitlist">
      <label for="wallet">WALLET ADDRESS</label>
      <input id="wallet" name="wallet" autocomplete="off" placeholder="Enter your wallet address" required>
      <div class="small">Use the wallet you want associated with your waitlist entry.</div>
      <button type="submit" style="margin-top:16px">JOIN WAITLIST</button>
      <div id="status"></div>
    </form>
  </section>

  <div class="footer">GLITCHED HOOD © 2026</div>
</main>
<script>
const form=document.getElementById('waitlist');
const status=document.getElementById('status');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  status.className='';
  status.textContent='SAVING...';
  const wallet=document.getElementById('wallet').value.trim();
  try{
    const r=await fetch('/api/waitlist',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({wallet})});
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||'Unable to save');
    status.className='ok';
    status.textContent='YOU ARE ON THE WAITLIST ✓';
    form.reset();
  }catch(err){
    status.className='err';
    status.textContent=err.message||'Something went wrong.';
  }
});
</script>
</body>
</html>
